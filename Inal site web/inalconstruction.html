<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page en construction - Inal Supermarché</title>
<style>
:root{
  --accent1: #ed3a3a;
  --accent2: #b1e908;
  --bg: #f7fbff;
  --text-color: #0f172a;
  --radius: 16px;
  font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  background: linear-gradient(180deg, #f7fbff, #eef6ff);
  color: var(--text-color);
  text-align:center;
  padding: 20px;
}
.construction-container{
  max-width: 600px;
  padding: 40px;
  border-radius: var(--radius);
  background: rgba(255,255,255,0.9);
  box-shadow: 0 12px 40px rgba(0,0,0,0.1);
  animation: fadeIn 1s ease forwards;
}
.construction-container h1{
  font-size: 2.5rem;
  background: linear-gradient(90deg, var(--accent1), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 20px;
}
.construction-container p{
  font-size: 1.1rem;
  margin-bottom: 30px;
  color: #334155;
}
.btn-back{
  display: inline-block;
  padding: 12px 28px;
  background: linear-gradient(90deg, var(--accent2), var(--accent1));
  color: #fff;
  font-weight: 700;
  border-radius: var(--radius);
  text-decoration: none;
  transition: all 0.3s ease;
}
.btn-back:hover{
  transform: scale(1.05);
  background: linear-gradient(90deg, var(--accent1), var(--accent2));
}

/* Animation */
@keyframes fadeIn{
  from{opacity:0; transform: translateY(20px);}
  to{opacity:1; transform: translateY(0);}
}

/* Responsive */
@media(max-width: 480px){
  .construction-container h1{font-size: 2rem;}
  .construction-container p{font-size: 1rem;}
  .btn-back{padding: 10px 22px;}
}
</style>
</head>
<body>
  <div class="construction-container">
    <h1>Page en construction 🚧</h1>
    <p>Cette section du site n’est pas encore disponible. Nous travaillons dessus pour vous offrir la meilleure expérience.</p>
    <a href="Inal.html" class="btn-back">Retour à l'accueil</a>
  </div>
</body>
</html>
